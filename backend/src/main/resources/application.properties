spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT}
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


logging.level.org.springframework=DEBUG
#logging.level.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.harshadcodes.EcommerceWebsite=DEBUG

security.secretKey=${JWT_SECRET_KEY}
security.expirationDate=${JWT_EXP_TIME}
security.jwtCookie=${JWT_COOKIE}

razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}

cloudinary_url=${CLOUDINARY_URL}

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}

frontend.url=${FRONTEND_URL}
